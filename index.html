      content="Conversão e análise de moedas com taxas de referência do BCE via Frankfurter API."
    />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-title" content="Currency Pro" />
    <title>Currency Exchange · Pro Terminal | Frankfurter API</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('fx:theme')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
          const themeColor = document.querySelector('meta[name="theme-color"]')
          if (themeColor) {
            themeColor.setAttribute('content', theme === 'light' ? '#f4f4f5' : '#050505')
          }
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
